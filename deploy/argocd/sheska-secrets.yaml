apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sheska-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    notifications.argoproj.io/subscribe.on-sync-failed.homelab: "C0BV08N8XFC"
    notifications.argoproj.io/subscribe.on-health-degraded.homelab: "C0BV08N8XFC"
    notifications.argoproj.io/subscribe.on-health-missing.homelab: "C0BV08N8XFC"
spec:
  project: sheska
  source:
    repoURL: https://github.com/makeUgreat/sheska.git
    path: deploy/helm/sheska-secrets
    targetRevision: master
  destination:
    server: https://kubernetes.default.svc
    namespace: sheska
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

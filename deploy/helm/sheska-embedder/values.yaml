replicaCount: 2

image:
  repository: willom2c/sheska-embedder
  pullPolicy: IfNotPresent
  # Placeholder — the deploy branch's copy of this file is what's actually
  # live; embedder-deploy.yml overwrites it with the built commit's sha tag
  # on every successful image publish. This value only matters if the
  # deploy branch is ever recreated from master.
  tag: "sha-e0f009626c2bce5abe3a09236873d939e69eaae4"

service:
  type: ClusterIP
  port: 11434

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 5Gi

nodeSelector: {}
tolerations: []

# hash-n97-1 also hosts control-plane, Traefik, WireGuard, and
# Prometheus/Grafana — avoid contending with those for CPU during inference.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - hash-n97-1

# Spread the 2 replicas across different nodes so serialized single-node
# request handling doesn't become a bottleneck under concurrent load.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys:
    - pod-template-hash

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sheska-postgres.fullname" . }}
  labels:
    {{- include "sheska-postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "sheska-postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "sheska-postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sheska-postgres.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user }}
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/sheska/postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.database.name }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: secrets
              mountPath: /run/secrets/sheska
              readOnly: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: initdb
          configMap:
            name: {{ include "sheska-postgres.fullname" . }}-initdb
        - name: secrets
          secret:
            secretName: {{ .Values.secret.name }}
            items:
              - key: postgres-password
                path: postgres-password
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.size }}

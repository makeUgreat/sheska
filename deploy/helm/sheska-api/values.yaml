replicaCount: 2
secret:
  name: sheska-api-secret
config:
  corsOrigins: app://obsidian.md,https://hash.meogle.co.kr
  # 텔레메트리의 deployment.environment.name이 된다.
  environment: production
image:
  repository: willom2c/sheska-api
  pullPolicy: IfNotPresent
  tag: "sha-55ef37f565b0d9379eeca26bc7a5b8cf2b69ea53"
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: cloudflare-tunnel
  annotations: {}
  hosts:
    - host: api-sheska.meogle.co.kr
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    memory: 512Mi
embedding:
  baseUrl: http://sheska-embedder.sheska.svc.cluster.local:11434
otel:
  exporterOtlpEndpoint: http://alloy.observability.svc.cluster.local:4318
nodeSelector: {}
tolerations: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - hash-n97-1
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys:
    - pod-template-hash

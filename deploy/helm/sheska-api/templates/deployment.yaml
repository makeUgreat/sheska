apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sheska-api.fullname" . }}
  labels:
    {{- include "sheska-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sheska-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sheska-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL_FILE
              value: /run/secrets/sheska/database-url
            - name: REDIS_URL
              value: {{ .Values.redis.url }}
            - name: EMBEDDING_BASE_URL
              value: {{ .Values.embedding.baseUrl }}
            - name: ATTACHMENT_STORAGE_ENDPOINT
              value: {{ required "attachmentStorage.endpoint가 필요합니다." .Values.attachmentStorage.endpoint | quote }}
            - name: ATTACHMENT_STORAGE_BUCKET
              value: {{ required "attachmentStorage.bucket이 필요합니다." .Values.attachmentStorage.bucket | quote }}
            - name: ATTACHMENT_STORAGE_ACCESS_KEY_ID_FILE
              value: /run/secrets/attachment-storage/access-key-id
            - name: ATTACHMENT_STORAGE_SECRET_ACCESS_KEY_FILE
              value: /run/secrets/attachment-storage/secret-access-key
            - name: CORS_ORIGINS
              value: {{ required "config.corsOrigins가 필요합니다." .Values.config.corsOrigins | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterOtlpEndpoint }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name={{ required "config.environment가 필요합니다." .Values.config.environment }},service.version={{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/sheska
              readOnly: true
            - name: attachment-storage
              mountPath: /run/secrets/attachment-storage
              readOnly: true
      volumes:
        {{- include "sheska-api.databaseVolume" . | nindent 8 }}
        - name: attachment-storage
          secret:
            secretName: {{ .Values.attachmentStorage.secretName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sheska-api.selectorLabels" $ | nindent 14 }}
          {{- with .matchLabelKeys }}
          matchLabelKeys:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

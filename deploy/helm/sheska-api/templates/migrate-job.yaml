apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sheska-api.fullname" . }}-migrate
  labels:
    {{- include "sheska-api.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sheska-api.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/database/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL_FILE
              value: /run/secrets/sheska/database-url
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/sheska
              readOnly: true
      volumes:
        {{- include "sheska-api.databaseVolume" . | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

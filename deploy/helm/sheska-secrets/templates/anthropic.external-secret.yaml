apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sheska-anthropic
  labels:
    {{- include "sheska-secrets.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: sheska-anthropic
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ required "parameterPrefix가 필요합니다." .Values.parameterPrefix }}/anthropic-api-key

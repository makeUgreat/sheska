apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sheska-owner-password
  labels:
    {{- include "sheska-secrets.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: sheska-owner-password
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "parameterPrefix가 필요합니다." .Values.parameterPrefix }}/owner-password

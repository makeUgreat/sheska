apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sheska-attachment-storage
  labels:
    {{- include "sheska-secrets.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: sheska-attachment-storage
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ required "parameterPrefix가 필요합니다." .Values.parameterPrefix }}/attachment-storage-access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: {{ required "parameterPrefix가 필요합니다." .Values.parameterPrefix }}/attachment-storage-secret-access-key

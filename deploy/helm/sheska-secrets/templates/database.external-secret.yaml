apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sheska-database
  labels:
    {{- include "sheska-secrets.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: sheska-database
    template:
      data:
        postgres-password: "{{ "{{" }} .password {{ "}}" }}"
        database-url: "postgres://{{ .Values.database.user }}:{{ "{{" }} .password {{ "}}" }}@{{ .Values.database.host }}:5432/{{ .Values.database.name }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "parameterPrefix가 필요합니다." .Values.parameterPrefix }}/postgres-password

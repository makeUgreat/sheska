services:
  db:
    image: pgvector/pgvector:pg18
    container_name: sheska.development.db
    environment:
      POSTGRES_DB: sheska
      POSTGRES_USER: sheska
      POSTGRES_PASSWORD: sheska
      PGDATA: /var/lib/postgresql/data
    ports:
      - '5432:5432'
    volumes:
      - sheska_development_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sheska -d sheska']
      start_period: 10s
      start_interval: 1s
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: sheska.development.redis
    ports:
      - '6379:6379'
    volumes:
      - sheska_development_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      start_period: 5s
      start_interval: 1s
      interval: 2s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: sheska.development.ollama
    ports:
      - '11434:11434'
    volumes:
      - sheska_development_ollama:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      start_period: 15s
      start_interval: 2s
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    container_name: sheska.development.ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ['ollama', 'pull', 'qwen3-embedding:0.6b']
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: no

  # Active embedding backend. Ollama above is kept running but unused by the
  # app — EMBEDDER is wired to TeiHttpEmbedder — so it's a quick rollback if
  # TEI needs to be reverted to.
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    # HuggingFace only publishes amd64 for this image; emulate on arm64 hosts
    # (e.g. Apple Silicon). Production nodes are amd64, so this only matters
    # for local development — and even under Rosetta, model warmup has been
    # observed to crash on Apple Silicon (see test/adapters/tei/support/
    # global-setup.ts). Apple Silicon devs should point EMBEDDING_BASE_URL at
    # a shared amd64 host instead of running this service locally.
    platform: linux/amd64
    container_name: sheska.development.tei
    command: ['--model-id', 'Qwen/Qwen3-Embedding-0.6B']
    # Host port 3001, not 3000 — the API dev server itself binds host 3000
    # when run locally (outside this compose file).
    ports:
      - '3001:3000'
    volumes:
      - sheska_development_tei:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      start_period: 15s
      start_interval: 2s
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sheska_development_db:
  sheska_development_redis:
  sheska_development_ollama:
  sheska_development_tei:

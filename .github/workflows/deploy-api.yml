name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'packages/contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 이미지의 커밋 SHA (생략 시 master의 최신 커밋)'
        required: false
        default: ''

env:
  IMAGE_NAME: sheska-api
  DOCKER_HUB_USERNAME: willom2c

jobs:
  wait-for-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "No CI run for $GITHUB_SHA"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  build:
    needs: wait-for-ci
    if: github.event_name == 'push'
    runs-on: [self-hosted, sheska]
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_HASH_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Clean up old local images (keep last 10)
        if: always()
        run: |
          IMAGE=${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          OLD_IMAGES=$(docker images "${IMAGE}" --format "{{.ID}} {{.CreatedAt}}" | sort -k2 | head -n -10 | awk '{print $1}')
          if [ -n "$OLD_IMAGES" ]; then
            echo "$OLD_IMAGES" | xargs -r docker rmi -f || true
          fi

      - name: Clean up dangling images
        if: success()
        run: docker image prune -f

      - name: Clean up BuildKit cache
        if: always()
        run: docker builder prune -af --max-used-space 15gb

  deploy:
    needs: [wait-for-ci, build]
    if: ${{ !cancelled() && needs.wait-for-ci.result != 'failure' && needs.build.result != 'failure' }}
    runs-on: [self-hosted, sheska]
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/update-deploy-branch
        with:
          service: ${{ env.IMAGE_NAME }}
          tag: sha-${{ inputs.sha || github.sha }}

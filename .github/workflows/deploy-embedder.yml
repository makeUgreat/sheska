name: Deploy Embedder

on:
  push:
    branches: [master]
    paths:
      - 'deploy/helm/sheska-embedder/Dockerfile'
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 이미지의 커밋 SHA (생략 시 master의 최신 커밋)'
        required: false
        default: ''

env:
  IMAGE_NAME: sheska-embedder
  DOCKER_HUB_USERNAME: willom2c

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: [self-hosted, sheska]
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_HASH_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: deploy/helm/sheska-embedder
          file: deploy/helm/sheska-embedder/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Clean up old local images (keep last 10)
        if: always()
        run: |
          IMAGE=${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          OLD_IMAGES=$(docker images "${IMAGE}" --format "{{.ID}} {{.CreatedAt}}" | sort -k2 | head -n -10 | awk '{print $1}')
          if [ -n "$OLD_IMAGES" ]; then
            echo "$OLD_IMAGES" | xargs -r docker rmi -f || true
          fi

      - name: Clean up dangling images
        if: success()
        run: docker image prune -f

      - name: Clean up BuildKit cache
        if: always()
        run: docker builder prune -af --max-used-space 15gb

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: [self-hosted, sheska]
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/update-deploy-branch
        with:
          service: ${{ env.IMAGE_NAME }}
          tag: sha-${{ inputs.sha || github.sha }}

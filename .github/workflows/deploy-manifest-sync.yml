name: Deploy Manifest Sync

on:
  push:
    branches:
      - master
    paths:
      - 'deploy/argocd/**'
      - 'deploy/helm/**'
      - '!deploy/helm/**/Dockerfile'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  BOT_NAME: "sheska-deploy[bot]"
  BOT_EMAIL: "sheska-deploy[bot]@bot.com"

jobs:
  sync-manifests:
    runs-on: [self-hosted, sheska]
    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Save live image tags
        uses: mikefarah/yq@v4
        with:
          cmd: |
            echo "API_TAG=$(yq eval '.image.tag' ./deploy/helm/sheska-api/values.yaml)" >> "$GITHUB_ENV"
            echo "EMBEDDER_TAG=$(yq eval '.image.tag' ./deploy/helm/sheska-embedder/values.yaml)" >> "$GITHUB_ENV"

      - name: Sync manifests from master
        run: |
          git config user.name "${{ env.BOT_NAME }}"
          git config user.email "${{ env.BOT_EMAIL }}"

          git fetch origin master
          git rm -r --ignore-unmatch deploy/argocd deploy/helm
          git checkout origin/master -- deploy/argocd deploy/helm

      - name: Restore live image tags
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq eval -i '.image.tag = strenv(API_TAG)' ./deploy/helm/sheska-api/values.yaml
            yq eval -i '.image.tag = strenv(EMBEDDER_TAG)' ./deploy/helm/sheska-embedder/values.yaml

      - name: Commit and push manifest changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            🤖 ci(deploy): sync manifests

            - Workflow: ${{ github.workflow }}
            - Triggered by: ${{ github.actor }}
            - Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Auto-generated by GitHub Actions
          branch: deploy
          file_pattern: "deploy/argocd/** deploy/helm/**"
          commit_user_name: ${{ env.BOT_NAME }}
          commit_user_email: ${{ env.BOT_EMAIL }}

name: Plugin Release

on:
  push:
    branches: [master]
    paths:
      - 'apps/obsidian-plugin/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions: {}

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "No CI run for $GITHUB_SHA"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  release-please:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs['apps/obsidian-plugin--release_created'] }}
      tag-name: ${{ steps.release.outputs['apps/obsidian-plugin--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-assets:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # pnpm cache 없음: 오염된 cache가 배포 파일에 들어가지 않게 함
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter "@sheska/obsidian-plugin..."
      - run: pnpm --filter "@sheska/obsidian-plugin..." build
      - run: gh release upload "$TAG" main.js manifest.json styles.css
        working-directory: apps/obsidian-plugin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag-name }}

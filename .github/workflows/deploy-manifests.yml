name: Deploy Manifests

on:
  push:
    branches: [master]
    paths:
      - 'deploy/argocd/**'
      - 'deploy/helm/**'
      - '!deploy/helm/**/Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, sheska]
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/update-deploy-branch

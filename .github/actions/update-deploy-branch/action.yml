name: Update deploy branch
description: deploy 브랜치에 master의 manifest를 복사하고, 지정한 서비스의 이미지 태그만 바꿈

inputs:
  service:
    description: '태그를 바꿀 서비스 (sheska-api, sheska-embedder). 비우면 manifest만 동기화함'
    required: false
    default: ''
  tag:
    description: '새 이미지 태그. 예: sha-<커밋 SHA>'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check image exists
      if: inputs.service != ''
      shell: bash
      env:
        IMAGE: willom2c/${{ inputs.service }}:${{ inputs.tag }}
      run: |
        if ! docker manifest inspect "$IMAGE" > /dev/null; then
          echo "::error::$IMAGE 이미지가 없습니다"
          exit 1
        fi

    - name: Checkout deploy branch
      uses: actions/checkout@v4
      with:
        ref: deploy
        path: deploy-branch
        fetch-depth: 0

    - name: Save live image tags
      uses: mikefarah/yq@v4
      with:
        cmd: |
          echo "API_TAG=$(yq eval '.image.tag' deploy-branch/deploy/helm/sheska-api/values.yaml)" >> "$GITHUB_ENV"
          echo "EMBEDDER_TAG=$(yq eval '.image.tag' deploy-branch/deploy/helm/sheska-embedder/values.yaml)" >> "$GITHUB_ENV"

    - name: Sync manifests from master
      shell: bash
      working-directory: deploy-branch
      env:
        SERVICE: ${{ inputs.service }}
        TAG: ${{ inputs.tag }}
      run: |
        git fetch origin master
        git rm -r -q --ignore-unmatch deploy/argocd deploy/helm
        git checkout origin/master -- deploy/argocd deploy/helm

        case "$SERVICE" in
          sheska-api) echo "API_TAG=$TAG" >> "$GITHUB_ENV" ;;
          sheska-embedder) echo "EMBEDDER_TAG=$TAG" >> "$GITHUB_ENV" ;;
        esac

    - name: Write image tags
      uses: mikefarah/yq@v4
      with:
        cmd: |
          yq eval -i '.image.tag = strenv(API_TAG)' deploy-branch/deploy/helm/sheska-api/values.yaml
          yq eval -i '.image.tag = strenv(EMBEDDER_TAG)' deploy-branch/deploy/helm/sheska-embedder/values.yaml

    - name: Commit and push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        repository: deploy-branch
        branch: deploy
        file_pattern: 'deploy/argocd/** deploy/helm/**'
        commit_user_name: 'sheska-deploy[bot]'
        commit_user_email: 'sheska-deploy[bot]@bot.com'
        commit_message: |
          🤖 ci(deploy): ${{ inputs.service && format('update {0} image tag', inputs.service) || 'sync manifests' }}

          - Application: ${{ inputs.service || 'none' }}
          - New Tag: ${{ inputs.tag || 'unchanged' }}
          - Workflow: ${{ github.workflow }}
          - Triggered by: ${{ github.actor }}
          - Build URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Auto-generated by GitHub Actions
